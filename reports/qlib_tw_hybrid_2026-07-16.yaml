# Qlib signal backtest scaffold
# Signal CSV: reports/tw_hybrid_2026-07-16.csv

qlib_init:
  provider_uri: ~/.qlib/qlib_data/custom_tw
  region: cn

market: custom_tw
benchmark: 2330.TW

strategy:
  class: TopkDropoutStrategy
  module_path: qlib.contrib.strategy
  kwargs:
    topk: 5
    n_drop: 1

executor:
  class: SimulatorExecutor
  module_path: qlib.backtest.executor
  kwargs:
    time_per_step: day
    generate_portfolio_metrics: true

notes:
  - Convert the signal CSV to a Qlib prediction object or load it in a custom Signal class.
  - Evaluate IC, Rank IC, long-short, top-k, turnover, transaction cost, and drawdown.
