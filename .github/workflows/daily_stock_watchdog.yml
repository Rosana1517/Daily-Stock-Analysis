name: Daily Stock Analysis Watchdog

on:
  workflow_dispatch:
  schedule:
    # Primary run: 08:30 Asia/Taipei, Monday-Friday.
    - cron: "30 0 * * 1-5"
    # Backup checks after the main 08:30 Asia/Taipei run.
    - cron: "50 0 * * 1-5"
    - cron: "20 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: daily-stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      CONFIG: configs/daily_quant_hybrid.example.json
      QUANT_CONFIG: configs/quant_platform.tw.example.json
      REPORT_BASE_URL: https://rosana1517.github.io/Daily-Stock-Analysis/reports
      PYTHONUNBUFFERED: "1"
      LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stop if LINE already sent today
        run: |
          marker="reports/line_sent_$(TZ=Asia/Taipei date +%F).txt"
          if [ -f "$marker" ]; then
            echo "line_skipped=already_sent_today"
            exit 0
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e ".[market]"

      - name: Refresh market and news data
        timeout-minutes: 12
        run: python -m stock_signal_system.cli refresh-data --config "$CONFIG"

      - name: Select dynamic candidates and refresh quant OHLCV history
        timeout-minutes: 15
        run: python -m stock_signal_system.cli refresh-quant-ohlcv --config "$QUANT_CONFIG" --period 1y

      - name: Refresh TWSE realtime quotes
        timeout-minutes: 4
        run: python -m stock_signal_system.cli refresh-quant-realtime --config "$QUANT_CONFIG" --cache data/twse_common_stock_realtime_cache.csv

      - name: Validate config
        run: python -m stock_signal_system.cli validate-config --config "$CONFIG"

      - name: Generate interactive report without LINE
        run: python -m stock_signal_system.cli run --config "$CONFIG"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish report to repository
        run: |
          latest_report="$(ls -t reports/stock_signals_*.html | head -n 1)"
          python -m stock_signal_system.cli publish-pages \
            --report-html "$latest_report" \
            --repo-dir . \
            --public-base-url "$REPORT_BASE_URL"

      - name: Send LINE report link
        run: |
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "line_failed=missing_LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi
          today="$(TZ=Asia/Taipei date +%F)"
          report_url="${REPORT_BASE_URL}/stock_signals_${today}.html"
          LINE_BODY="${today}

${report_url}" python -c "import os; from stock_signal_system.notify import send_notification; body=os.environ['LINE_BODY']; print(send_notification('', body, None, 'LINE_CHANNEL_ACCESS_TOKEN', None, True))"
          {
            echo "sent_at_utc=$(date -u +%FT%TZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > "reports/line_sent_${today}.txt"
          git add "reports/line_sent_${today}.txt"
          git commit -m "Mark LINE sent ${today}" || true
          git push || true
