name: Daily Stock Analysis Watchdog

on:
  workflow_dispatch:
  schedule:
    # Backup checks shortly after the main 17:30 Asia/Taipei run.
    - cron: "40 9 * * 1-5"
    - cron: "50 9 * * 1-5"

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-stock-analysis-watchdog
  cancel-in-progress: false

jobs:
  dispatch-if-needed:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily analysis if today's LINE marker is missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub 排程常被延遲好幾個小時。台北 00:00 之後「新的一天」還沒有
          # marker 是正常的，不是漏跑；這時重派整套分析只會多燒 Actions 時間，
          # 還可能在半夜發出 LINE。只在平日台北 17:35 之後(當天)才補跑。
          dow="$(TZ=Asia/Taipei date +%u)"
          hhmm="$((10#$(TZ=Asia/Taipei date +%H%M)))"
          if [ "$dow" -gt 5 ] || [ "$hhmm" -lt 1735 ]; then
            echo "watchdog_skipped=outside_window dow=${dow} hhmm=${hhmm}"
            exit 0
          fi
          today="$(TZ=Asia/Taipei date +%F)"
          marker="reports/line_sent_${today}.txt"
          if gh api "repos/${GITHUB_REPOSITORY}/contents/${marker}?ref=main" >/dev/null 2>&1; then
            echo "line_marker_exists=${marker}"
            exit 0
          fi

          echo "line_marker_missing=${marker}"
          latest_run_json="$(gh run list \
            --repo "${GITHUB_REPOSITORY}" \
            --workflow "Daily Stock Analysis" \
            --branch main \
            --limit 10 \
            --json databaseId,status,conclusion,event,createdAt \
            --jq "map(select((.createdAt | sub(\"Z$\"; \"+00:00\") | fromdateiso8601 | strftime(\"%Y-%m-%d\")) == \"${today}\")) | .[0]")"

          if [ -n "${latest_run_json}" ] && [ "${latest_run_json}" != "null" ]; then
            latest_status="$(echo "${latest_run_json}" | jq -r '.status')"
            latest_conclusion="$(echo "${latest_run_json}" | jq -r '.conclusion // ""')"
            latest_run_id="$(echo "${latest_run_json}" | jq -r '.databaseId')"
            latest_event="$(echo "${latest_run_json}" | jq -r '.event')"
            echo "latest_run_id=${latest_run_id}"
            echo "latest_run_event=${latest_event}"
            echo "latest_run_status=${latest_status}"
            echo "latest_run_conclusion=${latest_conclusion}"

            if [ "${latest_status}" = "queued" ] || [ "${latest_status}" = "in_progress" ]; then
              echo "daily_analysis_already_active=true"
              exit 0
            fi

            if [ "${latest_status}" = "completed" ] && [ "${latest_conclusion}" = "success" ]; then
              echo "daily_analysis_succeeded_without_marker=true"
            fi
          fi

          gh workflow run "Daily Stock Analysis" \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f send_line=true
