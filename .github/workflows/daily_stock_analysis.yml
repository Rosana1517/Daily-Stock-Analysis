name: Daily Stock Analysis

on:
  workflow_dispatch:
    inputs:
      send_line:
        description: "Send LINE broadcast after publishing"
        required: true
        default: "true"
      force_send_line:
        description: "Force LINE broadcast even if today's marker exists"
        required: false
        default: "false"
  schedule:
    # 17:30 Asia/Taipei, Monday-Friday (after same-day T86 chip data is published ~16:30-17:00).
    - cron: "30 9 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CONFIG: configs/daily_quant_hybrid.example.json
      QUANT_CONFIG: configs/quant_platform.tw.example.json
      REPORT_BASE_URL: https://rosana1517.github.io/Daily-Stock-Analysis/reports
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare Kronos repository
        run: git clone --depth 1 https://github.com/Rosana1517/Kronos.git external/Kronos

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[market]"
          python -m pip install git+https://github.com/Rosana1517/qlib.git
          python -m pip install git+https://github.com/Rosana1517/OpenBB.git#subdirectory=openbb_platform
          python -m pip install -r external/Kronos/requirements.txt

      - name: Refresh market and news data
        timeout-minutes: 12
        run: python -m stock_signal_system.cli refresh-data --config "$CONFIG"

      - name: Select dynamic candidates and refresh quant OHLCV history
        timeout-minutes: 15
        run: python -m stock_signal_system.cli refresh-quant-ohlcv --config "$QUANT_CONFIG" --period 1y

      - name: Refresh TWSE realtime quotes
        timeout-minutes: 4
        run: python -m stock_signal_system.cli refresh-quant-realtime --config "$QUANT_CONFIG" --cache data/twse_common_stock_realtime_cache.csv

      - name: Validate config
        run: python -m stock_signal_system.cli validate-config --config "$CONFIG"

      - name: Generate interactive report without LINE
        run: python -m stock_signal_system.cli run --config "$CONFIG"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish report to repository
        run: |
          latest_report="$(ls -t reports/stock_signals_*.html | head -n 1)"
          python -m stock_signal_system.cli publish-pages \
            --report-html "$latest_report" \
            --repo-dir . \
            --public-base-url "$REPORT_BASE_URL"
          # 記下這份報告實際的日期(資料日)。LINE 連結與 marker 都要用它，
          # 不能用發送當下的台北日期：GitHub 排程常被延遲到台北 00:00 之後才跑，
          # 那時「今天」已經跨日，會組出不存在的 stock_signals_<隔天>.html (404)，
          # 還會預先建立隔天的 marker，讓隔天正常時段的 LINE 被誤判成已發送。
          report_date="$(basename "$latest_report" .html | sed 's/^stock_signals_//')"
          echo "REPORT_DATE=${report_date}" >> "$GITHUB_ENV"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Send LINE report link
        if: ${{ (github.event_name == 'schedule') || (github.event.inputs.send_line == 'true') }}
        continue-on-error: true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          if [ -z "$REPORT_DATE" ]; then
            echo "line_failed=missing_REPORT_DATE"
            exit 1
          fi
          marker="reports/line_sent_${REPORT_DATE}.txt"
          force_send_line="${{ github.event.inputs.force_send_line }}"
          if [ -f "$marker" ] && [ "$force_send_line" != "true" ]; then
            echo "line_skipped=already_sent_for_${REPORT_DATE}"
            exit 0
          fi
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "line_failed=missing_LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi
          report_url="${REPORT_BASE_URL}/stock_signals_${REPORT_DATE}.html"
          # Pages 剛部署完可能還有傳播延遲；確認連結真的是 200 才發，
          # 寧可不發也不要把 404 連結推給使用者。
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$report_url" || true)"
            if [ "$code" = "200" ]; then ok=1; break; fi
            echo "report_url_not_ready http=${code} attempt=${attempt}"
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            echo "line_skipped=report_url_not_live url=${report_url}"
            exit 1
          fi
          LINE_BODY="$(printf '%s\n\n%s' "$REPORT_DATE" "$report_url")" python -c "import os; from stock_signal_system.notify import send_notification; body=os.environ['LINE_BODY']; print(send_notification('', body, None, 'LINE_CHANNEL_ACCESS_TOKEN', None, True))"
          {
            echo "sent_at_utc=$(date -u +%FT%TZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > "$marker"
          git add "$marker"
          git commit -m "Mark LINE sent ${REPORT_DATE}" || true
          git push || true
