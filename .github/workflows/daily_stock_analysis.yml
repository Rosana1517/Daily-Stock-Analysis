name: Daily Stock Analysis

on:
  workflow_dispatch:
    inputs:
      send_line:
        description: "Send LINE broadcast after publishing"
        required: true
        default: "true"
      force_send_line:
        description: "Force LINE broadcast even if today's marker exists"
        required: false
        default: "false"
  schedule:
    # 08:30 Asia/Taipei, Monday-Friday.
    - cron: "30 0 * * 1-5"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-stock-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      CONFIG: configs/daily_quant_hybrid.example.json
      QUANT_CONFIG: configs/quant_platform.tw.example.json
      REPORT_BASE_URL: https://rosana1517.github.io/Daily-Stock-Analysis/reports
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Prepare Kronos repository
        run: git clone --depth 1 https://github.com/Rosana1517/Kronos.git external/Kronos

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[market]"
          python -m pip install git+https://github.com/Rosana1517/qlib.git
          python -m pip install git+https://github.com/Rosana1517/OpenBB.git#subdirectory=openbb_platform
          python -m pip install -r external/Kronos/requirements.txt

      - name: Refresh market and news data
        timeout-minutes: 12
        run: python -m stock_signal_system.cli refresh-data --config "$CONFIG"

      - name: Select dynamic candidates and refresh quant OHLCV history
        timeout-minutes: 15
        run: python -m stock_signal_system.cli refresh-quant-ohlcv --config "$QUANT_CONFIG" --period 1y

      - name: Refresh TWSE realtime quotes
        timeout-minutes: 4
        run: python -m stock_signal_system.cli refresh-quant-realtime --config "$QUANT_CONFIG" --cache data/twse_common_stock_realtime_cache.csv

      - name: Validate config
        run: python -m stock_signal_system.cli validate-config --config "$CONFIG"

      - name: Generate interactive report without LINE
        run: python -m stock_signal_system.cli run --config "$CONFIG"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish report to repository
        run: |
          latest_report="$(ls -t reports/stock_signals_*.html | head -n 1)"
          python -m stock_signal_system.cli publish-pages \
            --report-html "$latest_report" \
            --repo-dir . \
            --public-base-url "$REPORT_BASE_URL"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Send LINE report link
        if: ${{ (github.event_name == 'schedule') || (github.event.inputs.send_line == 'true') }}
        continue-on-error: true
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          marker="reports/line_sent_$(TZ=Asia/Taipei date +%F).txt"
          force_send_line="${{ github.event.inputs.force_send_line }}"
          if [ -f "$marker" ] && [ "$force_send_line" != "true" ]; then
            echo "line_skipped=already_sent_today"
            exit 0
          fi
          if [ -z "$LINE_CHANNEL_ACCESS_TOKEN" ]; then
            echo "line_failed=missing_LINE_CHANNEL_ACCESS_TOKEN"
            exit 1
          fi
          today="$(TZ=Asia/Taipei date +%F)"
          report_url="${REPORT_BASE_URL}/stock_signals_${today}.html"
          LINE_BODY="$(printf '%s\n\n%s' "$today" "$report_url")" python -c "import os; from stock_signal_system.notify import send_notification; body=os.environ['LINE_BODY']; print(send_notification('', body, None, 'LINE_CHANNEL_ACCESS_TOKEN', None, True))"
          {
            echo "sent_at_utc=$(date -u +%FT%TZ)"
            echo "workflow_run=${GITHUB_RUN_ID}"
          } > "$marker"
          git add "$marker"
          git commit -m "Mark LINE sent ${today}" || true
          git push || true
