name: News Collector

# 每 2 小時抓一次 RSS 併進累積的新聞歷史(data/news_history.csv)，讓 17:30 的
# 主排程看得到當天稍早的新聞。單一媒體 RSS 只回傳最新 20~40 則，只在 17:30
# 抓一次會漏掉中午的重大事件(2026-10 的俄羅斯肺鼠疫新聞就是這樣漏掉)。
#
# 歷史檔用 GitHub Actions cache 在執行之間傳遞，不 commit 進 repo：主排程發布
# 報告時是直接 git push(沒有先 pull)，若這裡也定期 push 會互相衝突，讓主排程
# 失敗而發不出 LINE。

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */2 * * *"

permissions:
  contents: read

concurrency:
  group: news-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONFIG: configs/daily_quant_hybrid.example.json
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: python -m pip install -e .

      - name: Restore news history
        uses: actions/cache/restore@v4
        with:
          path: data/news_history.csv
          key: news-history-${{ github.run_id }}
          restore-keys: news-history-

      - name: Collect news
        run: python -m stock_signal_system.cli collect-news --config "$CONFIG" --history data/news_history.csv

      - name: Save news history
        uses: actions/cache/save@v4
        with:
          path: data/news_history.csv
          key: news-history-${{ github.run_id }}
